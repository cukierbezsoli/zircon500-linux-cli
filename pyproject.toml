[project]
name = "zircon500"
version = "1.0.0"
description = "Nieoficjalne narzędzie CLI dla systemu Linux do konfiguracji myszy Genesis Zircon 500 (v1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.9.0",
    "textual>=1.0.0",
    "typer>=0.15.0",
]

[project.scripts]
zircon500 = "zircon500.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zircon500"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]
